version: 2
updates:
  # Keep the GitHub Actions versions referenced in `.github/workflows/*` fresh.
  # Combined with major-version pinning in CI, this gives us reproducible,
  # auditable bumps via PRs (which themselves go through the CI here).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5
